<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
</head>
<body>
    <h1>Testing Backend Connection</h1>
    <div id="results"></div>
    
    <script>
        async function testConnection() {
            const resultsDiv = document.getElementById('results');
            
            try {
                console.log('Testing connection to http://localhost:3002/api/analysis/health');
                
                const response = await fetch('http://localhost:3002/api/analysis/health', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                if (response.ok) {
                    const data = await response.json();
                    resultsDiv.innerHTML = `
                        <h2 style="color: green;">✅ Connection Successful!</h2>
                        <p><strong>Status:</strong> ${data.status}</p>
                        <p><strong>Service:</strong> ${data.service}</p>
                        <p><strong>Framework:</strong> ${data.framework}</p>
                        <p><strong>Timestamp:</strong> ${data.timestamp}</p>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    resultsDiv.innerHTML = `
                        <h2 style="color: red;">❌ Connection Failed</h2>
                        <p>Status: ${response.status}</p>
                        <p>Status Text: ${response.statusText}</p>
                    `;
                }
            } catch (error) {
                resultsDiv.innerHTML = `
                    <h2 style="color: red;">❌ Connection Error</h2>
                    <p>Error: ${error.message}</p>
                    <p>This could be a CORS issue or the backend is not running.</p>
                `;
                console.error('Connection test failed:', error);
            }
        }
        
        // Test immediately when page loads
        testConnection();
    </script>
</body>
</html>
